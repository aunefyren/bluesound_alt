name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HACS serves the version from manifest.json, not the tag. If they
      # disagree, HACS offers an update that installs the same code forever.
      - name: Check manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python3 -c "import json; print(json.load(open('custom_components/bluesound_alt/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version '${TAG}' but manifest.json says '${MANIFEST}'"
            exit 1
          fi
          echo "Tag and manifest agree on ${MANIFEST}"

      # A release is what HACS users install, so it gets the full test run
      # against the tagged code, not just whatever last ran on main.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install -r requirements_test.txt
      - run: pytest --timeout=60
